spring.application.name=whgr

server.port=7777
server.servlet.context-path=/api
# SSE 长连接会占线程，不能是 1
server.tomcat.threads.max=50
server.tomcat.threads.min-spare=1

spring.mvc.pathmatch.matching-strategy=ant_path_matcher
spring.servlet.multipart.enabled=true

# 跨域允许的请求头（CorsFilter 读）
cors.allow.headers=token,Content-Type,type,Content-Disposition,x-requested-with,token-pc,req

# 数据库（docker compose 的 mysql1，端口 13303）
spring.datasource.url=jdbc:mysql://localhost:13303/whgr?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.type=com.zaxxer.hikari.HikariDataSource

# mapper xml 只扫 mapper/main/
mybatis.mapper-locations=classpath:mapper/main/*.xml

# 日期统一输出 yyyy-MM-dd HH:mm:ss，null 字段不返回
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=GMT+8
spring.jackson.default-property-inclusion=non_null

management.endpoints.web.exposure.include=*

# ai 入口（key 走环境变量，别写进仓库）
ai.enabled=${AI_ENABLED:true}
ai.base-url=${AI_BASE_URL:https://api.deepseek.com}
ai.model=${AI_MODEL:deepseek-v4-flash}
ai.api-key=${AI_API_KEY:${DEEPSEEK_API_KEY:}}
ai.max-steps=${AI_MAX_STEPS:5}
ai.timeout-seconds=${AI_TIMEOUT_SECONDS:90}
