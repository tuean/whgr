version: '3'
services:
  mysql1:
    image: mysql:8.0
    container_name: mysql1
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      # 命名卷：bind mount 的目录会被 Docker 建成 root 属主，本地也不该提交数据库文件
      - mysqldata:/var/lib/mysql
      # 初始化脚本只跑一次（空数据卷时）
      - ./sql/init-table.sql:/docker-entrypoint-initdb.d/01-init-table.sql
    environment:
      - "MYSQL_ROOT_PASSWORD=root"
      - "MYSQL_DATABASE=whgr"
      - "TZ=Asia/Shanghai"
    ports:
      - "13303:3306"

volumes:
  mysqldata:
